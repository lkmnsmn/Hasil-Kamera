    @keyframes subjectGlow {

      }

    // --- DRAG AND DROP OUT HELPER (Like Infinix AI & iOS 18) ---
    function setupPhotoDragData(e, photo, options = {}) {
      const isCutout = options.isCutout || false;
      const cleanTitle = photo.title.replace(/[^a-z0-9]/gi, '_');
      const filename = `${cleanTitle}${isCutout ? '_cutout' : ''}.jpg`;
      const url = photo.url;

      e.dataTransfer.effectAllowed = 'copyMove';

      // 1. Text & URI list (Supported by WhatsApp, Notes, Browser tabs, Discord)
      try {
        e.dataTransfer.setData('text/plain', url);
        e.dataTransfer.setData('text/uri-list', url);
      } catch(err) {}

      // 2. HTML representation
      try {
        e.dataTransfer.setData('text/html', `<img src="${url}" alt="${photo.title}" />`);
      } catch(err) {}

      // 3. DownloadURL (Chromium native drag-out directly onto desktop folders!)
      try {
        e.dataTransfer.setData('DownloadURL', `image/jpeg:${filename}:${url}`);
      } catch(err) {}

      // 4. Custom JSON payload
      try {
        e.dataTransfer.setData('application/json', JSON.stringify({
          source: 'refra-photos',
          isCutout,
          photo
        }));
      } catch(err) {}
    }

        if (e) e.stopPropagation();
        setPhotos(prev => prev.map(p => p.id === id ? { ...p, isFavorite: !p.isFavorite } : p));
      };

      const filteredPhotos = photos.filter(p => {
        if (onlyFavorites && !p.isFavorite) return false;
        if (selectedCategory !== 'All' && p.category !== selectedCategory) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          return p.title.toLowerCase().includes(q) || p.location.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
        }
        return true;
      });

        e.preventDefault();
        setSandboxOver(false);
        const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || 'https://images.unsplash.com/photo-1506744038136-46273834b3fb';

        try {
          const json = JSON.parse(e.dataTransfer.getData('application/json'));

                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-3 py-1 text-xs rounded-full transition-colors ${
                          selectedCategory === cat
                            ? 'bg-white dark:bg-neutral-700 text-neutral-900 dark:text-white shadow-xs font-semibold'
                            : 'text-neutral-500 hover:text-neutral-900 dark:hover:text-neutral-200'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}

                    <button
                      onClick={() => setOnlyFavorites(!onlyFavorites)}
                      className={`h-7 px-3 rounded-full text-xs font-medium flex items-center gap-1.5 transition-colors ${
                        onlyFavorites
                          ? 'bg-rose-500 text-white'
                          : 'bg-neutral-200/60 dark:bg-neutral-800/60 text-neutral-700 dark:text-neutral-300'
                      }`}
                    >
                      <IconHeart className="w-3.5 h-3.5" filled={onlyFavorites} />
                      <span>Favorit</span>
                    </button>
                  </div>
                </div>

                {/* Photos Grid with Native Drag Out */}
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                  {filteredPhotos.map((photo) => (
                    <div
                      key={photo.id}
                      draggable
                      onDragStart={(e) => setupPhotoDragData(e, photo)}
                      onClick={() => {
                        setActivePhoto(photo);
                        setIsSubjectLiftActive(false);
                      }}
                      className="group relative overflow-hidden rounded-2xl cursor-pointer bg-neutral-100 dark:bg-neutral-900 border border-neutral-200/50 dark:border-neutral-800/50 hover:-translate-y-1 hover:shadow-xl transition-all duration-300"
                    >
                      <div className="relative aspect-[4/3] overflow-hidden bg-neutral-800">
                        <img
                          src={photo.url}
                          alt={photo.title}
                          className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity" />

                        {/* Drag Out Badge */}
                        <div className="absolute top-2.5 left-2.5 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md text-white text-[11px] font-medium flex items-center gap-1.5 opacity-90 group-hover:opacity-100">
                          <IconMove className="w-3 h-3 text-sky-400" />
                          <span>Seret Keluar</span>
                        </div>

                        {/* Favorite button */}
                        <button
                          onClick={(e) => toggleFavorite(photo.id, e)}
                          className="absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-black/50 hover:bg-black/80 backdrop-blur-md text-white flex items-center justify-center transition-transform hover:scale-110"
                        >
                          <IconHeart className={`w-3.5 h-3.5 ${photo.isFavorite ? 'text-rose-500 fill-rose-500' : 'text-white'}`} filled={photo.isFavorite} />
                        </button>
                      </div>

                      {/* Clean Unboxed Metadata */}
                      <div className="p-3 text-neutral-800 dark:text-neutral-200">
                        <div className="flex items-center justify-between gap-2 mb-1">
                          <h4 className="font-semibold text-sm truncate text-neutral-900 dark:text-neutral-100">{photo.title}</h4>
                          <span className="text-[11px] text-neutral-500 font-mono">{photo.aspect}</span>
                        </div>
                        <div className="flex items-center gap-1.5 text-xs text-neutral-500">
                          <span>{photo.location}</span>
                          <span>·</span>
                          <span>{photo.category}</span>
                          <span>·</span>
                          <span className="font-mono">{photo.exif.megapixels}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: COLLECTIONS */}
            {activeTab === 'collections' && (
              <div className="space-y-8 py-4">
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-neutral-900 via-neutral-950 to-neutral-900 border border-neutral-800 text-white p-6 sm:p-8">
                  <div className="max-w-xl">
                    <span className="text-xs text-sky-400 font-semibold uppercase tracking-wider">Koleksi Terkurasi iOS 18</span>
                    <h2 className="text-2xl font-bold tracking-tight text-white mt-1 mb-2">ReFra Wallpapers & Frames</h2>
                    <p className="text-xs text-neutral-400 leading-relaxed mb-4">
                      Karya fotografi dengan dynamic range tinggi yang dioptimalkan untuk lock screen smartphone dan bingkai seni arsitektural.
                    </p>
                    <button
                      onClick={() => setActiveTab('framing')}
                      className="px-4 py-2 rounded-full bg-white text-neutral-950 font-bold text-xs flex items-center gap-2 hover:bg-neutral-100 transition-colors"
                    >
                      <IconFrame className="w-4 h-4" />
                      <span>Buka Framing Studio</span>
                    </button>
                  </div>
                </div>

                <div>
                  <h3 className="text-lg font-bold text-neutral-900 dark:text-white mb-3">Kategori Galeri</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    {['Nature', 'Architecture', 'Portrait', 'Minimalist'].map(cat => (
                      <div
                        key={cat}
                        onClick={() => {
                          setSelectedCategory(cat);
                          setActiveTab('library');
                        }}
                        className="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 cursor-pointer hover:border-sky-500 transition-all text-white"
                      >
                        <h4 className="font-bold text-sm">{cat}</h4>
                        <p className="text-[11px] text-neutral-400 mt-1">Ketuk untuk memfilter perpustakaan</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: FRAMING STUDIO (ReFra Signature) */}
            {activeTab === 'framing' && (
              <div className="space-y-6 py-4">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                  <div>
                    <h2 className="text-2xl font-bold tracking-tight text-neutral-900 dark:text-white">Framing & Device Studio</h2>
                    <p className="text-xs text-neutral-400">Pratinjau foto dalam pigura museum dan wallpaper iOS 18.</p>
                  </div>
                  <div
                    draggable
                    onDragStart={(e) => setupPhotoDragData(e, activePhoto || photos[0])}
                    className="px-4 py-2 rounded-full bg-sky-500 hover:bg-sky-400 text-neutral-950 font-bold text-xs flex items-center gap-2 cursor-grab shadow-sm"
                  >
                    <IconMove className="w-4 h-4" />
                    <span>Seret Seni Terbingkai Keluar</span>
                  </div>
                </div>

                <div
                  style={{ backgroundColor: wallColor }}
                  className="w-full min-h-[460px] rounded-3xl p-8 flex items-center justify-center transition-colors duration-500 relative border border-neutral-800"
                >
                  <div
                    draggable
                    onDragStart={(e) => setupPhotoDragData(e, activePhoto || photos[0])}
                    className={`relative max-w-full cursor-grab active:cursor-grabbing transition-all ${
                      activeFrame === 'museum-mat'
                        ? 'p-8 bg-[#faf8f5] shadow-2xl border-[14px] border-[#1e1e1e]'
                        : activeFrame === 'minimal-black'
                        ? 'p-2 bg-neutral-950 shadow-2xl border-[6px] border-neutral-900'
                        : activeFrame === 'natural-oak'
                        ? 'p-6 bg-[#f2eee9] shadow-2xl border-[16px] border-[#b08968]'
                        : activeFrame === 'ios-wallpaper'
                        ? 'w-[280px] aspect-[9/19.5] rounded-[48px] p-3.5 bg-neutral-900 border-[6px] border-neutral-700 shadow-2xl relative overflow-hidden'
                        : 'shadow-2xl'
                    }`}
                  >
                    {activeFrame === 'ios-wallpaper' && (
                      <>
                        <div className="absolute top-4 left-1/2 -translate-x-1/2 w-24 h-6 bg-black rounded-full z-20 flex items-center justify-end px-3">
                          <div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" />
                        </div>
                        <div className="absolute top-14 left-0 right-0 text-center z-20 text-white drop-shadow-md">
                          <p className="text-[11px] font-medium">Rabu, 28 Okt</p>
                          <p className="text-5xl font-light tracking-tighter">09:41</p>
                        </div>
                      </>
                    )}
                    <img
                      src={(activePhoto || photos[0]).url}
                      alt="Framed preview"
                      className={`max-w-full max-h-[50vh] object-cover ${activeFrame === 'ios-wallpaper' ? 'w-full h-full rounded-[36px]' : ''}`}
                    />
                  </div>
                </div>

                {/* Frame Options */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-neutral-900 p-5 rounded-2xl border border-neutral-800">
                  <div>
                    <h4 className="text-xs font-semibold text-neutral-400 mb-2 uppercase">Gaya Pigura</h4>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'museum-mat', label: 'Museum Mat' },
                        { id: 'minimal-black', label: 'Black Metal' },
                        { id: 'natural-oak', label: 'Oak Wood' },
                        { id: 'ios-wallpaper', label: 'iOS Screen' },
                        { id: 'none', label: 'Original' }
                      ].map(f => (
                        <button
                          key={f.id}
                          onClick={() => setActiveFrame(f.id)}
                          className={`py-2 px-2 text-xs rounded-xl font-medium transition-all ${
                            activeFrame === f.id ? 'bg-sky-500 text-neutral-950 font-bold' : 'bg-neutral-800 text-neutral-300'
                          }`}
                        >
                          {f.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h4 className="text-xs font-semibold text-neutral-400 mb-2 uppercase">Warna Dinding</h4>
                    <div className="flex items-center gap-3">
                      {['#171717', '#e7e0d6', '#262e35', '#f5f5f4'].map(color => (
                        <button
                          key={color}
                          onClick={() => setWallColor(color)}
                          style={{ backgroundColor: color }}
                          className={`w-9 h-9 rounded-xl border-2 ${wallColor === color ? 'border-sky-500 scale-105' : 'border-neutral-700'}`}
                        />
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* DETAIL MODAL (With Infinix Cutout & Frame Studio) */}
          {activePhoto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/85 backdrop-blur-xl">
              <div className="relative w-full max-w-5xl h-[88vh] flex flex-col md:flex-row overflow-hidden rounded-3xl bg-neutral-900 border border-neutral-800 shadow-2xl text-white">
                
                {/* Visual Area */}
                <div className="relative flex-1 flex flex-col items-center justify-center p-4 bg-neutral-950/70 select-none">
                  <div className="absolute top-4 left-4 right-4 flex items-center justify-between z-20">
                    <button
                      onClick={() => setActivePhoto(null)}
                      className="w-9 h-9 rounded-full bg-neutral-900 hover:bg-neutral-800 text-white flex items-center justify-center"
                    >
                      <IconX className="w-5 h-5" />
                    </button>

                    {/* AI Cutout / Subject Lift Button */}
                    <button
                      onClick={() => setIsSubjectLiftActive(!isSubjectLiftActive)}
                      className={`px-3.5 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 transition-all ${
                        isSubjectLiftActive
                          ? 'bg-gradient-to-r from-sky-400 to-purple-400 text-neutral-950 ring-2 ring-white/50'
                          : 'bg-neutral-800 text-white hover:bg-neutral-700'
                      }`}
                    >
                      <IconSparkles className="w-3.5 h-3.5" />
                      <span>{isSubjectLiftActive ? 'Subjek Terisolasi (AI Cutout)' : 'Angkat Subjek (AI Cutout)'}</span>
                    </button>
                  </div>

                  {/* Photo Display */}
                  <div
                    draggable
                    onDragStart={(e) => setupPhotoDragData(e, activePhoto, { isCutout: isSubjectLiftActive })}
                    className="relative cursor-grab active:cursor-grabbing max-w-full max-h-[60vh] flex items-center justify-center"
                  >
                    <img
                      src={activePhoto.url}
                      alt={activePhoto.title}
                      className={`max-w-full max-h-[60vh] object-contain rounded-2xl shadow-2xl transition-all ${
                        isSubjectLiftActive ? 'animate-subject-lift ring-4 ring-sky-400' : ''
                      }`}
                    />
                  </div>

                  {/* Drag Out Handle */}
                  <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-20">
                    <div
                      draggable
                      onDragStart={(e) => setupPhotoDragData(e, activePhoto, { isCutout: isSubjectLiftActive })}
                      className="flex items-center gap-2 px-4 py-2 rounded-full bg-sky-500 hover:bg-sky-400 text-neutral-950 font-bold text-xs shadow-lg cursor-grab active:cursor-grabbing transition-transform active:scale-95"
                    >
                      <IconMove className="w-4 h-4" />
                      <span>{isSubjectLiftActive ? 'Seret Cutout ke Aplikasi Lain' : 'Seret Foto ke Desktop / Aplikasi Lain'}</span>
                    </div>
                  </div>
                </div>

                {/* Info & Inspector Sidebar */}
                <div className="w-full md:w-80 flex flex-col justify-between border-t md:border-t-0 md:border-l border-neutral-800 bg-neutral-900 p-5 overflow-y-auto">
                  <div className="space-y-5">
                    <div>
                      <span className="text-xs text-sky-400 font-semibold">{activePhoto.category}</span>
                      <h3 className="text-xl font-bold text-white mt-0.5">{activePhoto.title}</h3>
                      <p className="text-xs text-neutral-400">{activePhoto.location}</p>
                    </div>

                    {/* Color Palette */}
                    <div>
                      <span className="text-xs font-semibold text-neutral-400 block mb-1.5 uppercase">Palet Warna ReFra</span>
                      <div className="flex gap-1.5 h-8">
                        {activePhoto.palette.map(hex => (
                          <div
                            key={hex}
                            onClick={() => {
                              navigator.clipboard.writeText(hex);
                              setCopiedColor(hex);
                              setTimeout(() => setCopiedColor(null), 1500);
                            }}
                            style={{ backgroundColor: hex }}
                            title={`Salin ${hex}`}
                            className="flex-1 rounded-lg cursor-pointer hover:scale-105 transition-transform flex items-center justify-center text-[10px]"
                          >
                            {copiedColor === hex && <IconCheck className="w-3 h-3 text-white drop-shadow" />}
                          </div>
                        ))}
                      </div>
                      {copiedColor && <p className="text-[10px] text-emerald-400 mt-1">Tersalin: {copiedColor}</p>}
                    </div>

                    {/* EXIF Data */}
                    <div className="p-3 bg-neutral-950/60 rounded-xl border border-neutral-800 text-xs space-y-1 text-neutral-400 font-mono">
                      <div className="flex justify-between"><span>Kamera:</span> <span className="text-white">{activePhoto.exif.camera}</span></div>
                      <div className="flex justify-between"><span>Lensa:</span> <span className="text-white">{activePhoto.exif.lens}</span></div>
                      <div className="flex justify-between"><span>Eksposur:</span> <span className="text-white">{activePhoto.exif.aperture} · {activePhoto.exif.shutterSpeed}</span></div>
                      <div className="flex justify-between"><span>Resolusi:</span> <span className="text-white">{activePhoto.exif.megapixels}</span></div>
                    </div>
                  </div>

                  <div className="pt-4 border-t border-neutral-800 flex gap-2">
                    <button
                      onClick={() => toggleFavorite(activePhoto.id)}
                      className="flex-1 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-xs font-bold text-white flex items-center justify-center gap-1.5"
                    >
                      <IconHeart className="w-3.5 h-3.5 text-rose-500" filled={activePhoto.isFavorite} />
                      <span>{activePhoto.isFavorite ? 'Favorit' : 'Sukai'}</span>
                    </button>
                    <a
                      href={activePhoto.url}
                      download={`${activePhoto.title}.jpg`}
                      className="py-2 px-4 rounded-xl bg-white text-neutral-950 text-xs font-bold flex items-center gap-1.5"
                    >
                      <IconDownload className="w-3.5 h-3.5" />
                      <span>Unduh</span>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* DROP TESTER SANDBOX DRAWER */}
          {isSandboxOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/60 backdrop-blur-md">
              <div className="w-full sm:max-w-2xl max-h-[85vh] rounded-t-3xl sm:rounded-3xl bg-neutral-900 border border-neutral-800 shadow-2xl flex flex-col overflow-hidden text-neutral-100">
                <div className="px-5 py-4 border-b border-neutral-800 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <IconSparkles className="w-5 h-5 text-sky-400" />
                    <h3 className="font-bold text-sm text-white">External App Drop Tester</h3>
                  </div>
                  <button onClick={() => setIsSandboxOpen(false)} className="text-xs text-neutral-400 hover:text-white">Tutup</button>
                </div>

                <div className="flex gap-2 px-5 pt-3 border-b border-neutral-800 text-xs font-semibold">
                  {['chat', 'notes', 'canvas'].map(tab => (
                    <button
                      key={tab}
                      onClick={() => setSandboxTab(tab)}
                      className={`pb-2 px-2 capitalize border-b-2 ${sandboxTab === tab ? 'border-sky-500 text-sky-400' : 'border-transparent text-neutral-500'}`}
                    >
                      {tab === 'chat' ? 'WhatsApp / Chat' : tab === 'notes' ? 'iOS Notes' : 'Canvas Editor'}
                    </button>
                  ))}
                </div>

                <div className="p-5 flex-1 overflow-y-auto space-y-4">
                  <div
                    onDragOver={(e) => { e.preventDefault(); setSandboxOver(true); }}
                    onDragLeave={() => setSandboxOver(false)}
                    onDrop={handleDropInSandbox}
                    className={`py-8 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center text-center cursor-copy transition-colors ${
                      sandboxOver ? 'border-sky-400 bg-sky-500/15' : 'border-neutral-700 bg-neutral-950/40'
                    }`}
                  >
                    <IconMove className="w-6 h-6 text-sky-400 mb-2" />
                    <p className="text-sm font-semibold text-white">Lepaskan Foto di Sini!</p>
                    <p className="text-xs text-neutral-400 mt-0.5">Seret foto dari galeri atas atau modal detail langsung ke kotak ini.</p>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-2">Foto Diterima ({droppedItems.length})</h4>
                    {droppedItems.length === 0 ? (
                      <p className="text-xs text-neutral-500 text-center py-4">Belum ada foto yang diseret ke aplikasi ini.</p>
                    ) : (
                      <div className="space-y-2">
                        {droppedItems.map(item => (
                          <div key={item.id} className="p-2.5 rounded-xl bg-neutral-950 border border-neutral-800 flex items-center gap-3">
                            <img src={item.url} alt={item.title} className="w-12 h-12 rounded-lg object-cover" />
                            <div className="flex-1 min-w-0 text-xs">
                              <p className="font-bold text-white truncate">{item.title}</p>
                              <p className="text-[10px] text-neutral-400">Diterima di {item.target} · {item.time}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React application into the root container
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
