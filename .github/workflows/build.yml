
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Convert Web to Android APK
        uses: web2apk/web2apk-action@v1
        with:
          app_name: 'ReFra Photos'
          package_name: 'com.refra.photos'
          web_dir: '.'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReFra-Photos-APK
          path: '*.apk'
