name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate APK via PWABuilder
        uses: pwa-builder/pwa-action@v1.0.2
        with:
          url: 'https://glistening-cajeta-8f0748.netlify.app'
          output-type: 'apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReFra-Photos-APK
          path: '**.apk'
