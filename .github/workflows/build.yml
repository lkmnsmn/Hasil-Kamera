name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK via Web2App
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Webview App
        run: |
          flutter create app
          cd app
          rm -rf lib/main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          void main() => runApp(const MaterialApp(home: Scaffold(body: SafeArea(child: WebViewWidget(controller: WebViewController()..setJavaScriptMode(JavaScriptMode.unrestricted)..loadFlutterAsset('assets/index.html'))))));
          EOF
          mkdir -p assets
          cp ../index.html assets/index.html
          echo "  assets:" >> pubspec.yaml
          echo "    - assets/index.html" >> pubspec.yaml
          echo "dependencies:" >> pubspec.yaml
          echo "  webview_flutter: ^4.2.0" >> pubspec.yaml
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReFra-Photos-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
