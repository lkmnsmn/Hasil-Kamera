name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Webview APK
        uses: Android-Actions/pwa-to-apk@v1
        with:
          name: 'ReFra Photos'
          package-name: 'com.refra.photos'
          index-path: 'index.html'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReFra-Photos-APK
          path: '*.apk'
